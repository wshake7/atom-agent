packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  "@vscode/ripgrep": 1.18.0
  "@modelcontextprotocol/sdk": 1.30.0
  lefthook: 2.1.9
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.9
  vite-plus: latest
  cspell: latest
  commitlint: latest
  "@commitlint/config-conventional": latest
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Allow lefthook's postinstall script to run so it downloads the platform binary
# (Windows/macOS/Linux + arch). Without this, pnpm 11+ refuses to run install scripts.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  json-editor-vue: true
  lefthook: true
  vue-demi: true

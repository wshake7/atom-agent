# 取代 Vite+ `vp config` 安装时注入的 hook，改为仓库内版本受控配置。
# 跳过：LEFTHOOK=0 git commit / git commit --no-verify
#
# 约定：
# - 会改写文件的任务加 stage_fixed；只读校验不要加。
# - 同路径上「先改写再校验」必须串行（同一 run 或 piped group），不要与 parallel 竞态。

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  jobs:
    - name: format:staged
      run: pnpm exec vp staged
      stage_fixed: true

    - name: cspell:staged
      glob:
        - "*.md"
        - "*.yml"
        - "*.yaml"
        - "*.jsonc"
      # 只扫本次暂存命中文件；--no-must-find-files 避免空列表时 cspell 非 0。
      run: pnpm exec cspell lint --no-progress --no-must-find-files {staged_files}

post-merge:
  jobs:
    - name: deps:install
      files: git diff-tree -r --name-only --no-commit-id ORIG_HEAD HEAD
      glob:
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - "**/package.json"
      run: pnpm install

pre-push:
  skip:
    - merge
    - rebase
  jobs:
    - name: check:full
      # 只读 check。源码/配置未进本次 push 时跳过。
      glob:
        - "*.ts"
        - "*.json"
        - "*.jsonc"
        - pnpm-workspace.yaml
        - pnpm-lock.yaml
      run: pnpm exec vp check

commit-msg:
  skip:
    - merge
    - rebase
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
